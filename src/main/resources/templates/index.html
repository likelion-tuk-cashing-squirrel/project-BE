<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Borderless AI Proxy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" href="data:,">
</head>
<body>

<!-- 닉네임 및 로그아웃 버튼 영역 -->
<div style="position: absolute; top: 20px; right: 30px; display: flex; align-items: center; color: #E2E8F0;">
    <!-- 닉네임 출력 부분 -->
    <span th:text="${nickname} + '님 환영합니다!'" style="margin-right: 15px; font-size: 15px; font-weight: bold;">
        사용자님 환영합니다!
    </span>

    <!-- 로그아웃 버튼 -->
    <form th:action="@{/logout}" method="post" style="margin: 0;">
        <button type="submit" style="background-color: #EF4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#DC2626'" onmouseout="this.style.backgroundColor='#EF4444'">
            로그아웃
        </button>
    </form>
</div>

<!-- 기존 메인 번역 영역 -->
<div class="container">
    <h1>Borderless AI 번역 프록시</h1>
    <div class="subtitle">토큰 효율성을 극대화한 스마트 AI 번역 시스템</div>

    <label for="inputText">번역할 문장을 입력하세요</label>
    <textarea id="inputText" placeholder="여기에 텍스트를 입력하세요..."></textarea>

    <button onclick="sendTranslationRequest()">번역 요청하기</button>

    <div id="resultArea">
        <h3>결과 화면</h3>
        <p id="outputText">아직 요청된 번역이 없습니다.</p>
    </div>
</div>

</body>
</html>
