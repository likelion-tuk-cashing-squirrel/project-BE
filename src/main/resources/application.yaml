spring:
  application:
    name: proxy

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/borderless?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true