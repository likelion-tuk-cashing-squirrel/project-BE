spring:
  application:
    name: proxy

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 라우팅(STEP 01) 임계치. 실측 데이터로 조정할 값이라 하드코딩하지 않는다.
routing:
  # o200k_base 기준 토큰 수. 이 값 미만이면 마스킹·피벗을 생략하고 SKIP으로 통과시킨다.
  token-threshold: 50
  # 언어 감지 신뢰도. 이 값 미만이면 오판으로 보고 TIER_1(영어 취급)로 폴백한다.
  confidence-threshold: 0.7

# ---------------------------------------------------------------------------
# 외부 API 설정 (client 파트)
# API 키는 반드시 환경변수로 주입. 값을 직접 적어서 커밋하지 말 것
# 로컬 실행 시 .env 파일 사용 (build.gradle이 읽어서 환경변수로 주입)
# ---------------------------------------------------------------------------
app:
  openai:
    base-url: ${OPENAI_BASE_URL:}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_DEFAULT_MODEL:}
    temperature: 0.3
    max-tokens: 2048
    timeout: 30s
    max-retries: 2

  deepl:
    # 키가 ':fx'로 끝나면(무료/Developer 키) api-free.deepl.com 사용
    # 어긋나면 403 Wrong endpoint 발생
    base-url: ${DEEPL_BASE_URL:}
    api-key: ${DEEPL_API_KEY:}
    timeout: 10s
    max-retries: 2

  # 형태소 분석 사이드카(FastAPI). TIER_3(타갈로그)에서만 호출한다.
  # 타갈로그 형태소 분석기가 Python에만 있어 별도 프로세스로 분리했다.
  morphology:
    # EC2에서는 같은 호스트의 컨테이너(8000)로 뜬다. 비어 있으면 힌트 없이 진행한다.
    base-url: ${MORPHOLOGY_BASE_URL:}
    # 번역·LLM보다 짧게 잡는다. 힌트는 보조 정보라 여기서 오래 붙잡히면 손해다.
    timeout: 3s
    # 사이드카 장애를 서비스 전체 장애로 번지게 하지 않는다. 힌트 없이 통과시킨다.
    optional: true

logging:
  level:
    com.borderless.proxy.client: DEBUG
