spring:
  application:
    name: proxy

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 라우팅(STEP 01) 임계치. 실측 데이터로 조정할 값이라 하드코딩하지 않는다.
routing:
  # o200k_base 기준 토큰 수. 이 값 미만이면 마스킹·피벗을 생략하고 SKIP으로 통과시킨다.
  token-threshold: 50
  # 언어 감지 신뢰도. 이 값 미만이면 오판으로 보고 TIER_1(영어 취급)로 폴백한다.
  confidence-threshold: 0.7