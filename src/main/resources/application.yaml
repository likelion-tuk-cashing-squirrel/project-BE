spring:
  application:
    name: proxy

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/borderless?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 라우팅(STEP 01) 임계치. 실측 데이터로 조정할 값이라 하드코딩하지 않는다.
routing:
  # o200k_base 기준 토큰 수. 이 값 미만이면 마스킹·피벗을 생략하고 SKIP으로 통과시킨다.
  token-threshold: 50
  # 언어 감지 신뢰도. 이 값 미만이면 오판으로 보고 TIER_1(영어 취급)로 폴백한다.
  confidence-threshold: 0.7