spring:
  application:
    name: proxy

  # Java 21 가상 스레드 활성화
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# ---------------------------------------------------------------------------
# 커스텀 비즈니스 설정
# ---------------------------------------------------------------------------
routing:
  # o200k_base 기준 토큰 수. 이 값 미만이면 마스킹·피벗을 생략하고 SKIP으로 통과시킨다.
  token-threshold: 50
  # 언어 감지 신뢰도. 이 값 미만이면 오판으로 보고 TIER_1(영어 취급)로 폴백한다.
  confidence-threshold: 0.7

billing:
  # 절약한 금액에 곱하는 성과 수수료율. 원가에 얹는 마크업이 아니라 절약분에만 적용된다.
  fee-rate: 0.10
  # 모델별 단가(USD / 100만 토큰). 키는 UsageLog.modelName에 저장할 이름과 맞춘다.
  models:
    "[gpt-4.1-mini]":
      input-per-million: 0.40
      output-per-million: 1.60
    "[gpt-4o]":
      input-per-million: 2.50
      output-per-million: 10.00
    "[gpt-4o-mini]":
      input-per-million: 0.15
      output-per-million: 0.60

# ---------------------------------------------------------------------------
# 외부 API 설정 (Client 파트)
# ---------------------------------------------------------------------------
app:
  openai:
    base-url: ${OPENAI_BASE_URL:}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_DEFAULT_MODEL:}
    temperature: 0.3
    max-tokens: 2048
    timeout: 30s
    max-retries: 2

  deepl:
    base-url: ${DEEPL_BASE_URL:}
    api-key: ${DEEPL_API_KEY:}
    timeout: 10s
    max-retries: 2

  morphology:
    # 형태소 분석 사이드카(FastAPI). EC2에서는 같은 호스트의 컨테이너(8000)로 뜬다.
    base-url: ${MORPHOLOGY_BASE_URL:}
    timeout: 3s
    optional: true

logging:
  level:
    com.borderless.proxy.client: DEBUG