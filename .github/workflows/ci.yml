name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-boot:
    name: Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Build Docker image
        run: docker build -t borderless-proxy:ci .

  fastapi:
    name: FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import check
        run: python -c "from app.main import app; assert app.title == 'borderless-fastapi'"

      - name: Build Docker image
        run: docker build -t borderless-fastapi:ci .
