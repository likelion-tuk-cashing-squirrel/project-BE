name: Benchmark

# 언어별 토큰 소모량 벤치마크를 CI에서 돌린다.
#
# 로컬에서 손으로 돌린 결과는 "우리가 만든 숫자"라 검증이 안 된다. GitHub 서버에서 돌리면
# 실행 로그와 아티팩트가 커밋에 묶여 공개 URL로 남으므로, 제3자가 직접 확인할 수 있다.
#
# 결과 표는 $GITHUB_STEP_SUMMARY로 실행 페이지에 렌더링된다.
# 원시 요청·응답 본문은 아티팩트로 올린다.
#
# DeepL 문자 할당량을 소모한다. OpenAI 호출은 없다.

on:
  push:
    branches: [develop, "feat/**"]
    # 측정 코드나 벤치마크 워크플로가 바뀔 때만 돌린다. 무관한 푸시로 할당량을 쓰지 않는다.
    paths:
      - "src/test/java/com/borderless/proxy/benchmark/**"
      - "src/main/java/com/borderless/proxy/routing/TokenCalculator.java"
      - ".github/workflows/benchmark.yml"
      - "build.gradle"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-tokens:
    name: 언어별 토큰 소모량
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run benchmark
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPL_BASE_URL: ${{ secrets.DEEPL_BASE_URL }}
        run: ./gradlew benchmark --no-daemon --console=plain

      - name: 결과를 실행 요약에 기록
        if: always()
        run: |
          if [ -f build/measurement/benchmark-summary.md ]; then
            cat build/measurement/benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "벤치마크가 요약을 생성하지 못했습니다. 로그를 확인하세요." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 원시 데이터 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            build/measurement/
            docs/benchmark-language-tokens.html
          retention-days: 90
          if-no-files-found: warn
