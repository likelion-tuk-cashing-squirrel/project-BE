plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.borderless'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	// kakao
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// 애플 실리콘(M칩) Mac DNS 호환성 에러 해결용
	implementation 'io.netty:netty-resolver-dns-native-macos:4.2.15.Final:osx-aarch_64'

	// 라우팅: OpenAI 토큰 수 계산 (o200k_base 인코딩 지원 버전)
	implementation 'com.knuddels:jtokkit:1.1.0'
	// 라우팅: 언어 감지 (내장 프로파일에 en/vi/tl 포함)
	implementation 'com.optimaize.languagedetector:language-detector:0.6'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// ---------------------------------------------------------------------------
// .env 파일을 읽어 test / bootRun 의 환경변수로 주입
// Gradle도 Spring도 .env 를 자동으로 읽지 않으므로 여기서 직접 처리
// 실제 OS 환경변수가 이미 있으면 그쪽 우선 (CI/서버에서는 .env 없이 동작)
// ---------------------------------------------------------------------------
def dotenv = [:]
def dotenvFile = rootProject.file('.env')
if (dotenvFile.exists()) {
	dotenvFile.eachLine('UTF-8') { rawLine ->
		def line = rawLine.trim()
		if (line.isEmpty() || line.startsWith('#')) {
			return
		}
		def idx = line.indexOf('=')
		if (idx <= 0) {
			return
		}
		def key = line.substring(0, idx).trim()
		def value = line.substring(idx + 1).trim()
		if (value.length() >= 2 && value.startsWith('"') && value.endsWith('"')) {
			value = value.substring(1, value.length() - 1)
		}
		dotenv[key] = value
	}
	logger.lifecycle(".env 로드: ${dotenv.keySet().join(', ')}")
}

tasks.named('test') {
	useJUnitPlatform()

	// .env 값 주입 (OS 환경변수가 이미 있으면 그쪽 우선)
	dotenv.each { k, v ->
		if (System.getenv(k) == null) {
			environment k, v
		}
	}
}

// 로컬 실행(./gradlew bootRun)에도 .env 주입
tasks.named('bootRun') {
	dotenv.each { k, v ->
		if (System.getenv(k) == null) {
			environment k, v
		}
	}
}

// ---------------------------------------------------------------------------
// 벤치마크 전용 태스크
//
// ./gradlew benchmark --console=plain
//
// 표준 출력을 그대로 보여준다. 측정 결과를 파일로만 남기면 "실제로 돌렸는가"를
// 보여줄 수 없어서, 터미널 화면 자체를 증빙 자료로 쓸 수 있게 했다.
// 테스트 이벤트 로그(PASSED/FAILED 줄)는 끄고 측정 출력만 남긴다.
//
// 외부 API를 호출하므로 일반 `test`에서는 환경변수 가드로 스킵된다.
// 이 태스크는 그 변수를 직접 넣어 항상 실행한다. DeepL 문자 할당량을 소모한다.
// ---------------------------------------------------------------------------
tasks.register('benchmark', Test) {
	group = 'verification'
	description = '언어별 토큰 벤치마크 실행 (DeepL 호출 발생, 결과를 콘솔에 출력)'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.borderless.proxy.benchmark.*'
	}

	environment 'RUN_PIPELINE_MEASUREMENT', 'true'
	dotenv.each { k, v ->
		if (System.getenv(k) == null) {
			environment k, v
		}
	}

	testLogging {
		showStandardStreams = true
		events()
		exceptionFormat = 'full'
	}

	// 캐시로 스킵되면 화면에 아무것도 안 나온다. 증빙용이라 매번 실제로 돌려야 한다.
	outputs.upToDateWhen { false }
}
