plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.borderless'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	// kakao
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// 애플 실리콘(M칩) Mac DNS 호환성 에러 해결용
	implementation 'io.netty:netty-resolver-dns-native-macos:4.2.15.Final:osx-aarch_64'

	// 라우팅: OpenAI 토큰 수 계산 (o200k_base 인코딩 지원 버전)
	implementation 'com.knuddels:jtokkit:1.1.0'
	// 라우팅: 언어 감지 (내장 프로파일에 en/vi/tl 포함)
	implementation 'com.optimaize.languagedetector:language-detector:0.6'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// ---------------------------------------------------------------------------
// .env 파일을 읽어 test / bootRun 의 환경변수로 주입
// Gradle도 Spring도 .env 를 자동으로 읽지 않으므로 여기서 직접 처리
// 실제 OS 환경변수가 이미 있으면 그쪽 우선 (CI/서버에서는 .env 없이 동작)
// ---------------------------------------------------------------------------
def dotenv = [:]
def dotenvFile = rootProject.file('.env')
if (dotenvFile.exists()) {
	dotenvFile.eachLine('UTF-8') { rawLine ->
		def line = rawLine.trim()
		if (line.isEmpty() || line.startsWith('#')) {
			return
		}
		def idx = line.indexOf('=')
		if (idx <= 0) {
			return
		}
		def key = line.substring(0, idx).trim()
		def value = line.substring(idx + 1).trim()
		if (value.length() >= 2 && value.startsWith('"') && value.endsWith('"')) {
			value = value.substring(1, value.length() - 1)
		}
		dotenv[key] = value
	}
	logger.lifecycle(".env 로드: ${dotenv.keySet().join(', ')}")
}

tasks.named('test') {
	useJUnitPlatform()

	// .env 값 주입 (OS 환경변수가 이미 있으면 그쪽 우선)
	dotenv.each { k, v ->
		if (System.getenv(k) == null) {
			environment k, v
		}
	}
}

// 로컬 실행(./gradlew bootRun)에도 .env 주입
tasks.named('bootRun') {
	dotenv.each { k, v ->
		if (System.getenv(k) == null) {
			environment k, v
		}
	}
}
